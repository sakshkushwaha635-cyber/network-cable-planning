<!DOCTYPE html>
<html>
<head><title>Cable Planning - MST</title>
<style>body{background:#0f172a;color:#fff;font-family:sans-serif;padding:20px}
.card{background:#1e293b;padding:15px;border-radius:10px;margin:10px 0}
input,select,button{padding:8px;margin:5px;border-radius:5px;border:none}
button{background:#0ea5e9;color:#fff;cursor:pointer}
canvas{background:#0b1220;border-radius:10px;width:100%;height:400px;border:1px solid #333}
</style></head>
<body>
<h2>🌐 Network Cable Planning - Kruskal MST</h2>
<div class="card">
<input id="a" placeholder="From (0,1..)"><input id="b" placeholder="To"><input id="c" placeholder="Cost" type="number">
<button onclick="add()">Add Cable</button>
<button onclick="run()">Run MST</button>
<button onclick="location.reload()">Clear</button>
<div>Total: <b id="cost">0 m</b></div>
</div>
<canvas id="cv" width="700" height="400"></canvas>
<div id="log" class="card" style="font-family:monospace;font-size:13px"></div>

<script>
let edges=[], nodes=5, mst=[], N=5;
let pos=[[100,100],[300,80],[500,100],[200,250],[400,250]];
let dsu,p,r;
function DSU(n){p=[...Array(n).keys()];r=Array(n).fill(0)}
DSU.prototype.find=x=>p[x]==x?x:p[x]=this.find(p[x]);
DSU.prototype.union=(a,b)=>{a=p[a]==a?a:this.find(a);b=p[b]==b?b:this.find(b);if(a==b)return 0;p[b]=a;return 1}

function add(){
 let f=+a.value,t=+b.value,c=+c.value;
 if(f==t)return alert('From!=To'); edges.push({f,t,c}); draw(); log(`Added ${f}-${t}:${c}m`);
}
function run(){
 DSU(N); edges.sort((x,y)=>x.c-y.c); mst=[]; let tot=0; let parent=[...Array(N).keys()];
 function find(x){return parent[x]==x?x:parent[x]=find(parent[x])}
 function union(x,y){x=find(x);y=find(y);if(x==y)return 0;parent[y]=x;return 1}
 log('Sorted cables: '+edges.map(e=>e.c).join(','));
 edges.forEach(e=>{if(union(e.f,e.t)){mst.push(e);tot+=e.c;log(`✓ ${e.f}-${e.t} ${e.c}m`)}else log(`✗ ${e.f}-${e.t} cycle`)});
 document.getElementById('cost').innerText=tot+' m'; draw();
}
function log(m){document.getElementById('log').innerHTML+=m+'<br>'}
function draw(){
 let cv=document.getElementById('cv'), ctx=cv.getContext('2d'); ctx.clearRect(0,0,700,400);
 edges.forEach(e=>{let is=mst.includes(e);ctx.strokeStyle=is?'#10b981':'#555';ctx.lineWidth=is?3:1;ctx.beginPath();ctx.moveTo(pos[e.f][0],pos[e.f][1]);ctx.lineTo(pos[e.t][0],pos[e.t][1]);ctx.stroke();ctx.fillStyle='#fff';ctx.fillText(e.c+'m',(pos[e.f][0]+pos[e.t][0])/2,(pos[e.f][1]+pos[e.t][1])/2)});
 pos.forEach((p,i)=>{ctx.fillStyle='#38bdf8';ctx.beginPath();ctx.arc(p[0],p[1],20,0,6.28);ctx.fill();ctx.fillStyle='#fff';ctx.fillText('B'+i,p[0]-10,p[1]+4)});
}
// sample
edges=[{f:0,t:1,c:40},{f:0,t:2,c:60},{f:1,t:2,c:30},{f:1,t:3,c:70},{f:2,t:4,c:40}]; draw();
</script>
</body>
</html>
